<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milona – Fotos do lançamento</title>
<link rel="icon" href="icone-192.png">
<style>
  :root{--azul:#0B3A5B;--laranja:#F28C28;--fundo:#F2F5F8;--texto:#1B2A38;--suave:#5E6E7E}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--texto)}
  header{background:var(--azul);color:#fff;padding:16px;display:flex;align-items:center;gap:12px}
  header img{width:44px;height:44px;border-radius:50%}
  header small{display:block;font-size:11px;letter-spacing:.08em;opacity:.8}
  header b{font-size:18px}
  main{max-width:520px;margin:0 auto;padding:16px}
  .prot{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;color:var(--suave)}
  .prot b{color:var(--texto);font-size:16px;display:block;margin-top:2px}
  a.op{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid #E1E7ED;border-radius:14px;
       padding:16px;margin-bottom:12px;text-decoration:none;color:var(--texto);transition:border-color .15s}
  a.op:hover{border-color:var(--laranja)}
  .num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:20px}
  .op b{display:block;font-size:17px}
  .op span{font-size:13px;color:var(--suave)}
  .vazio{opacity:.45;pointer-events:none}
  p.dica{font-size:13px;color:var(--suave);text-align:center;margin-top:18px}
</style>
</head>
<body>
<header>
  <img src="icone-192.png" alt="">
  <div><small>MILONA TRANSPORTADORA</small><b>Fotos do lançamento</b></div>
</header>
<main>
  <div class="prot">Protocolo<b id="prot">—</b></div>
  <div id="lista"></div>
  <p class="dica">Cada foto abre no Google Drive da Milona.</p>
</main>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('prot').textContent = q.get('p') || '—';
  var itens = [
    {k:'b', ic:'⛽', nome:'Foto da bomba', sub:'Valor do abastecimento'},
    {k:'x', ic:'💲', nome:'Foto do PIX', sub:'Comprovante de pagamento ao posto'},
    {k:'k', ic:'🚛', nome:'Foto do painel', sub:'KM do veículo'}
  ];
  var lista = document.getElementById('lista');
  itens.forEach(function(it){
    var id = (q.get(it.k) || '').replace(/[^\w-]/g, '');
    var a = document.createElement('a');
    a.className = 'op' + (id ? '' : ' vazio');
    if (id) { a.href = 'https://drive.google.com/file/d/' + id + '/view'; a.target = '_blank'; a.rel = 'noopener'; }
    a.innerHTML = '<div class="num"></div><div><b></b><span></span></div>';
    a.querySelector('.num').textContent = it.ic;
    a.querySelector('b').textContent = it.nome;
    a.querySelector('span').textContent = id ? it.sub : 'Foto não disponível';
    lista.appendChild(a);
  });
</script>
</body>
</html>
